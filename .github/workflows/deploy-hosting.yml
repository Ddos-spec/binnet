name: Deploy BINNET to Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binnet-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Validate build output
        run: |
          test -d dist
          test -f dist/index.html

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy dist to BINNET hosting
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || secrets.SSH_HOST }}
          FTP_USER: ${{ secrets.FTP_USER || 'vercel@binnet.biz.id' }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${FTP_HOST:-}" ]; then
            echo "Missing GitHub secret: FTP_HOST (or legacy SSH_HOST)"
            exit 1
          fi
          if [ -z "${FTP_USER:-}" ]; then
            echo "Missing GitHub secret: FTP_USER"
            exit 1
          fi
          if [ -z "${FTP_PASS:-}" ]; then
            echo "Missing GitHub secret: FTP_PASS"
            exit 1
          fi

          LFTP_BASE="set cmd:fail-exit yes; set ftp:ssl-allow yes; set ftp:ssl-force no; set ssl:verify-certificate no; set net:timeout 30; set net:max-retries 3; open -u \"$FTP_USER\",\"$FTP_PASS\" ftp://$FTP_HOST;"

          # Some cPanel FTP users are jailed directly inside public_html, while
          # main FTP users can see /public_html. Detect the correct target.
          if lftp -c "$LFTP_BASE cls -d /public_html >/dev/null; bye" >/dev/null 2>&1; then
            REMOTE_DIR="/public_html/"
          else
            REMOTE_DIR="/"
          fi

          echo "Deploying Astro build to hosting target: $REMOTE_DIR"
          lftp -c "$LFTP_BASE mirror --reverse --delete --verbose \
            --exclude .htaccess \
            --exclude-glob '.well-known/**' \
            --exclude-glob 'cgi-bin/**' \
            dist/ $REMOTE_DIR; bye"

      - name: Deployment summary
        if: success()
        run: echo "BINNET production hosting deployment completed successfully."
