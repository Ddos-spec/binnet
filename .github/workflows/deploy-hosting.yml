name: Deploy BINNET to cPanel via FTPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binnet-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Validate complete static build
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/_astro
          test -d dist/media

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('dist')
          html = (root / 'index.html').read_text(encoding='utf-8')
          refs = set(re.findall(r'''(?:href|src)=["'](/(?:_astro|media|fonts)/[^"'#?]+)''', html))
          missing = [ref for ref in sorted(refs) if not (root / ref.lstrip('/')).is_file()]

          if missing:
              print('Build references missing local assets:', file=sys.stderr)
              for ref in missing:
                  print(f'  - {ref}', file=sys.stderr)
              sys.exit(1)

          if not any((root / '_astro').iterdir()):
              print('dist/_astro is empty', file=sys.stderr)
              sys.exit(1)

          print(f'Validated {len(refs)} referenced assets.')
          PY

      - name: Deploy dist directly to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.binnet.biz.id
          username: binnetbi
          password: ${{ secrets.FTP_PASS }}
          port: 21
          protocol: ftps
          local-dir: ./dist/
          server-dir: public_html/
          state-name: .ftp-deploy-sync-state-v1.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Deployment summary
        run: |
          echo "BINNET build validated and uploaded directly to cPanel public_html via FTPS."
          echo "Source commit: $GITHUB_SHA"
