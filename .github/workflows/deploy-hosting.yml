name: Build BINNET for cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binnet-cpanel-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Validate build output
        run: |
          test -d dist
          test -f dist/index.html
          printf '%s\n' "$GITHUB_SHA" > dist/deploy-health.txt

      - name: Publish static build to cpanel-deploy
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_DIR="$(mktemp -d)"
          cp -a dist/. "$DEPLOY_DIR/"

          cat > "$DEPLOY_DIR/.cpanel.yml" <<'YAML'
          ---
          deployment:
            tasks:
              - export DEPLOYPATH=/home/binnetbi/public_html/
              - /bin/rsync -av --delete --exclude='.git/' --exclude='.cpanel.yml' "$CPANEL_SOURCE_DIR/" "$DEPLOYPATH/"
          YAML

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the deployment branch history continuous so cPanel can use a
          # normal fast-forward Update from Remote instead of handling forced or
          # unrelated histories.
          git fetch origin cpanel-deploy
          git checkout -B cpanel-deploy origin/cpanel-deploy

          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$DEPLOY_DIR/." .

          git add -A
          if git diff --cached --quiet; then
            echo "No deployment changes to publish."
          else
            git commit -m "deploy: Astro build ${GITHUB_SHA::7}"
            git push origin cpanel-deploy
          fi

      - name: Build summary
        run: |
          echo "Astro build published to branch cpanel-deploy."
          echo "cPanel repository: /home/binnetbi/repos/binnet"
