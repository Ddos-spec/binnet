name: Deploy BINNET to Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binnet-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Validate build output
        run: |
          test -d dist
          test -f dist/index.html
          printf '%s\n' "$GITHUB_SHA" > dist/deploy-health.txt

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy dist to BINNET hosting
        env:
          FTP_HOSTNAME: ftp.binnet.biz.id
          FTP_DIRECT_IP: 103.234.210.46
          FTP_PORT: '21'
          FTP_USER: ${{ secrets.FTP_USER || 'binnetbi' }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${FTP_PASS:-}" ]; then
            echo "Missing GitHub repository secret: FTP_PASS"
            exit 1
          fi

          echo "Resolving FTP hostname..."
          getent ahostsv4 "$FTP_HOSTNAME" || true

          tcp_ok() {
            local host="$1"
            timeout 8 bash -c "cat < /dev/null > /dev/tcp/${host}/${FTP_PORT}" >/dev/null 2>&1
          }

          echo "Testing TCP ${FTP_HOSTNAME}:${FTP_PORT}..."
          if tcp_ok "$FTP_HOSTNAME"; then
            FTP_HOST="$FTP_HOSTNAME"
            echo "Hostname endpoint is reachable."
          else
            echo "Hostname endpoint is not reachable from GitHub Actions."
            echo "Testing direct hosting IP ${FTP_DIRECT_IP}:${FTP_PORT}..."
            if tcp_ok "$FTP_DIRECT_IP"; then
              FTP_HOST="$FTP_DIRECT_IP"
              echo "Direct hosting IP is reachable; using IP fallback."
            else
              echo "ERROR: Neither ${FTP_HOSTNAME}:${FTP_PORT} nor ${FTP_DIRECT_IP}:${FTP_PORT} is reachable from GitHub Actions."
              echo "This indicates a hosting firewall / FTP service reachability issue, not an Astro build issue."
              exit 20
            fi
          fi

          LFTP_BASE="set cmd:fail-exit yes; set ftp:passive-mode true; set ftp:ssl-allow yes; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set net:timeout 20; set net:max-retries 2; set net:reconnect-interval-base 3; set net:reconnect-interval-multiplier 1; open -p $FTP_PORT -u \"$FTP_USER\",\"$FTP_PASS\" ftp://$FTP_HOST;"

          echo "Testing explicit FTPS authentication..."
          lftp -c "$LFTP_BASE pwd; bye"

          if lftp -c "$LFTP_BASE cls -d /public_html >/dev/null; bye" >/dev/null 2>&1; then
            REMOTE_DIR="/public_html/"
          else
            REMOTE_DIR="/"
          fi

          echo "Testing FTPS upload to $REMOTE_DIR..."
          lftp -c "$LFTP_BASE put -O $REMOTE_DIR dist/deploy-health.txt; bye"

          echo "Deploying Astro build to BINNET hosting target: $REMOTE_DIR"
          lftp -c "$LFTP_BASE mirror --reverse --continue --verbose --parallel=1 --delete \
            --exclude .htaccess \
            --exclude-glob '.well-known/**' \
            --exclude-glob 'cgi-bin/**' \
            dist/ $REMOTE_DIR; bye"

      - name: Deployment summary
        if: success()
        run: echo "BINNET production hosting deployment completed successfully."
