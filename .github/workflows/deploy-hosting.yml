name: Build BINNET production bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binnet-production-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Validate complete static build
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/_astro
          test -d dist/media

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('dist')
          html = (root / 'index.html').read_text(encoding='utf-8')
          refs = set(re.findall(r'''(?:href|src)=["'](/(?:_astro|media|fonts)/[^"'#?]+)''', html))
          missing = [ref for ref in sorted(refs) if not (root / ref.lstrip('/')).is_file()]

          if missing:
              print('Build references missing local assets:', file=sys.stderr)
              for ref in missing:
                  print(f'  - {ref}', file=sys.stderr)
              sys.exit(1)

          astro_files = [p for p in (root / '_astro').iterdir() if p.is_file()]
          if not astro_files:
              print('dist/_astro is empty', file=sys.stderr)
              sys.exit(1)

          print(f'Validated {len(refs)} referenced assets and {len(astro_files)} Astro assets.')
          PY

          printf '%s\n' "$GITHUB_SHA" > dist/deploy-health.txt

      - name: Publish static build to cpanel-deploy branch
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="$(mktemp -d)"
          cp -a dist/. "$BUILD_DIR/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin cpanel-deploy
          git checkout -B cpanel-deploy origin/cpanel-deploy

          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$BUILD_DIR/." .

          git add -A
          if git diff --cached --quiet; then
            echo "No production changes to publish."
          else
            git commit -m "deploy: static build ${GITHUB_SHA::7}"
            git push origin cpanel-deploy
          fi

      - name: Build summary
        run: |
          echo "BINNET production bundle published to cpanel-deploy."
          echo "Source commit: $GITHUB_SHA"
